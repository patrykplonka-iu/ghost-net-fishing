<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bergung übernehmen</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <h1>Bergung übernehmen</h1>

    <p>
        Auf dieser Seite kann eine bergende Person die Bergung eines gemeldeten Geisternetzes übernehmen.
    </p>

    <h2>Geisternetz</h2>

    <p>
        ID:
        <span th:text="${ghostNet.id}">1</span>
    </p>

    <p>
        Standort:
        <span th:text="${ghostNet.latitude}">52.520008</span>,
        <span th:text="${ghostNet.longitude}">13.404954</span>
    </p>

    <p>
        Geschätzte Größe (m²):
        <span th:text="${ghostNet.estimatedSize}">25</span>
    </p>

    <p>
        Aktueller Status:
        <span th:text="${ghostNet.status}">GEMELDET</span>
    </p>

    <form th:action="@{/ghostnets/{id}/assign(id=${ghostNet.id})}" method="post">
        <div>
            <label for="rescuerName">Name der bergenden Person:</label>
            <input type="text" id="rescuerName" name="rescuerName" required>
        </div>

        <div>
            <label for="rescuerPhone">Telefonnummer:</label>
            <input type="text" id="rescuerPhone" name="rescuerPhone" required>
        </div>

        <button type="submit">Bergung übernehmen</button>
    </form>

    <p>
        <a href="/ghostnets">Zurück zur Übersicht</a>
    </p>
</body>
</html>
